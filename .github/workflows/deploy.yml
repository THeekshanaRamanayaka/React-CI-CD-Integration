name: Deploy React app to AWS S3 and Trigger CodePipeline

on:
    pull_request:
        types:
            - closed
    push:
        branches:
            - dev

jobs:
    deploy:
        if: github.event.pull_request.merged == true || github.ref == 'refs/heads/dev'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:     
                node-version: 22.14.0
              

            - name: Install Dependencies
              run: npm install

            - name: Build React App
              run: npm run build

            - name: Decode AWS Credentials
              run: |
                echo "${{secrets.AWS_ACCESS_KEY_ID}}" | base64 --decode >> aws_access_key_id.txt
                echo "${{secrets.AWS_SECRET_ACCESS_KEY}}" | base64 --decode >> aws_secret_access_key.txt       
                echo "${{secrets.AWS_BUCKET_NAME}}" | base64 --decode >> aws_bucket_name.txt
                echo "${{secrets.CODEPIPELINE_NAME}}" | base64 --decode >> codepipeline_name.txt
             
              shell: bash

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: $(cat aws_access_key_id.txt)
                  aws-secret-access-key: $(cat aws_secret_access_key.txt)
                  aws-region: ${{secrets.AWS_REGION}}

            - name: Upload Build to S3
              run: aws s3 sync build/ s3://$(cat aws_bucket_name.txt) --delete

            - name: Trigger CodePipeline
              run: aws codepipeline start-pipeline-execution --name $(cat codepipeline_name.txt)