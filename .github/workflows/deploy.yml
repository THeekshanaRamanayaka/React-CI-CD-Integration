name: Deploy React app to AWS S3 and Trigger CodePipeline

on:
    pull_request:
        types:
            - closed
    push:
        branches:
            - dev

jobs:
    deploy:
        if: github.event.pull_request.merged == true || github.ref == 'refs/heads/dev'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:     
                node-version: 22.14.0
              

            - name: Install Dependencies
              run: npm install

            - name: Build React App
              run: npm run build

            - name: Verify Build Directory
              run: ls -la dist/

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}
         
            - name: Upload to S3 with Correct Content-Type
              run: aws s3 sync build/ s3://${{ secrets.S3_BUCKET_NAME }} --delete --content-type "text/html"

            - name: Trigger CodePipeline
              run: aws codepipeline start-pipeline-execution --name ${{ secrets.PIPELINE_NAME }}